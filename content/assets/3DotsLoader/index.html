<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>3DotsLoader</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <!-- <link rel="stylesheet" href="./style.css"> -->
  <style>
    .container-preloader * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container-preloader html {
      border: 6px solid #444;
    }

    .container-preloader html,
    .container-preloader body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #2F2F31;
      min-height: calc(100vh - 12px);
    }

    .container-preloader,
    .dot-container-preloader {
      position: relative;
      width: 100px;
      height: 100px;
    }

    .container-preloader {
      transform-origin: center;
      animation: anirotate 10s linear infinite;
    }

    .dot-container-preloader {
      position: absolute;
      border: 0px solid #fff;
      border-radius: 50px;
    }

    .dot-container-preloader:nth-child(2) {
      transform: rotate(40deg);
    }

    .dot-container-preloader:nth-child(2) .dot {
      animation-delay: -0.5s;
    }

    .dot-container-preloader:nth-child(3) {
      transform: rotate(80deg);
    }

    .dot-container-preloader:nth-child(3) .dot {
      animation-delay: -1s;
    }

    .dot {
      position: absolute;
      height: 10px;
      width: 10px;
      background: linear-gradient(60deg, hsl(152, 10%, 10%),hsl(152, 74%, 93%)); /* DOT COLOR */
      border-radius: 5px;
      transform: translate(0, 0);
    }

    .dot:nth-child(1) {
      top: 0;
      left: calc(50% - 5px);
      animation: ani1 2s infinite;
    }

    .dot:nth-child(2) {
      bottom: calc(28% - 5px);
      left: calc(11% - 5px);
      animation: ani2 2s infinite;
    }

    .dot:nth-child(3) {
      bottom: calc(28% - 5px);
      right: calc(11% - 5px);
      animation: ani3 2s infinite;
    }

    [hidden] {
      display: none;
    }

    @keyframes anirotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(-359deg);
      }
    }

    @keyframes ani1 {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(-40px, 67px);
      }
    }

    @keyframes ani2 {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(77px, 0);
      }
    }

    @keyframes ani3 {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(-39px, -67px);
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prefixfree/1.0.7/prefixfree.min.js"></script>

</head>

<body>
  <!-- partial:index.partial.html -->
  <div class="container-preloader">
    <div class="dot-container-preloader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="dot-container-preloader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="dot-container-preloader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  <!-- partial -->

</body>

</html>
